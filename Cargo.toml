[package]
name = "fastapi-turbo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_fastapi_turbo_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["auto-initialize", "extension-module"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde_json = "1"
crossbeam-channel = "0.5"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
sendfd = { version = "0.4.4", features = ["tokio"] }
bytes = "1"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-full", "fs", "validate-request", "set-header", "limit"] }
url = "2"
memchr = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "fastapi-turbo-bench"
path = "src/bin/bench_client.rs"
