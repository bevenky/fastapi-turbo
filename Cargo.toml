[package]
name = "fastapi-turbo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_fastapi_turbo_core"
crate-type = ["cdylib"]

[dependencies]
# extension-module only: auto-initialize is for EMBEDDING Python in Rust
# binaries (none of ours touch Python — the bench client is pure HTTP), and
# it hard-fails against the static /opt/python interpreters in manylinux
# containers, killing Linux wheel builds (release.yml dry-run #3).
# For Rust tests that need an embedded interpreter, pass
# `--features pyo3/auto-initialize` explicitly.
pyo3 = { version = "0.28", features = ["extension-module"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde_json = "1"
crossbeam-channel = "0.5"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
bytes = "1"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-full", "fs", "validate-request", "set-header", "limit"] }
url = "2"
memchr = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "fastapi-turbo-bench"
path = "src/bin/bench_client.rs"

# Unix-only: multi-worker fd passing (SCM_RIGHTS over a Unix socket).
# Declared per-target so Windows wheels build — the first release.yml
# dry-run proved Windows compilation was impossible with this unconditional.
[target.'cfg(unix)'.dependencies]
sendfd = { version = "0.4.4", features = ["tokio"] }
