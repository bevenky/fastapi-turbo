# Standalone raw-Axum reference server for the bench matrix. Declared as
# its own workspace (empty members) so it does not get pulled into the
# parent fastapi-turbo crate's build graph.
[workspace]

[package]
name = "raw-axum-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "raw-axum-bench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
